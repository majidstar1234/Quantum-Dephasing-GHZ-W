name: AI Book Factory - Autonomous

on:
  workflow_dispatch:
    inputs:
      max_chapters:
        description: "0 = process all available chapters"
        required: false
        default: "0"
        type: string
      max_revisions:
        description: "Maximum AI revision cycles per chapter"
        required: false
        default: "2"
        type: string
  schedule:
    - cron: "0 13 * * 1"

concurrency:
  group: ai-book-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  book-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      MAX_CHAPTERS: ${{ inputs.max_chapters || '0' }}
      MAX_REVISIONS: ${{ inputs.max_revisions || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install XeLaTeX and Persian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-arabic texlive-latex-extra fonts-noto-core fonts-noto-extra

      - name: Run autonomous writer/reviewer pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/pipeline.py

      - name: Compile PDF
        if: ${{ hashFiles('output/book.tex') != '' }}
        working-directory: output
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error book.tex

      - name: Upload PDF artifact
        if: ${{ hashFiles('output/book.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-book-pdf
          path: output/book.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publish PDF as GitHub Release
        if: ${{ hashFiles('output/book.pdf') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="book-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" output/book.pdf \
            --title "Book build $TAG" \
            --notes "Automatically generated by AI Book Factory."
